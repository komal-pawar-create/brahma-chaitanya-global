      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="50%" stop-color="#0D253F"/>
      <stop offset="100%" stop-color="#0A3E4C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D17A"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="270" r="160" fill="#0A9396" opacity="0.1"/>
  <circle cx="400" cy="270" r="120" fill="none" stroke="#C59B27" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Stylized Potato Icon -->
  <g transform="translate(400, 270) scale(1.3)">
    <path d="M-60,-20 C-65,30 -30,65 15,60 C55,55 75,20 70,-20 C65,-55 20,-60 -20,-55 C-45,-50 -55,-40 -60,-20 Z" fill="#D97706" stroke="#B45309" stroke-width="3" opacity="0.9"/>
    <!-- Spots -->
    <circle cx="-25" cy="-10" r="3" fill="#78350F" opacity="0.6"/>
    <circle cx="15" cy="20" r="2.5" fill="#78350F" opacity="0.6"/>
    <circle cx="35" cy="-20" r="3" fill="#78350F" opacity="0.6"/>
    <circle cx="-10" cy="30" r="2" fill="#78350F" opacity="0.6"/>
  </g>

  <!-- Labels -->
