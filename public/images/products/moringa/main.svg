<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="50%" stop-color="#0D253F"/>
      <stop offset="100%" stop-color="#0A3E4C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D17A"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="270" r="160" fill="#0A9396" opacity="0.1"/>
  <circle cx="400" cy="270" r="120" fill="none" stroke="#C59B27" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Stylized Moringa Leaf / Bowl Icon -->
  <g transform="translate(400, 270) scale(1.3)">
    <path d="M-50,20 C-40,60 40,60 50,20 Z" fill="#047857" stroke="#065F46" stroke-width="3"/>
    <ellipse cx="0" cy="20" rx="50" ry="12" fill="#10B981" stroke="#059669" stroke-width="2"/>
    <!-- Small Leaf Sprigs -->
    <path d="M0,10 C0,-30 20,-60 20,-60 C20,-60 -5,-35 0,10" fill="#34D399" stroke="#059669" stroke-width="2"/>
    <path d="M0,-10 C-15,-25 -25,-45 -25,-45 C-25,-45 -5,-25 0,-10" fill="#34D399" stroke="#059669" stroke-width="2"/>
    <path d="M5,-20 C25,-30 35,-45 35,-45 C35,-45 15,-30 5,-20" fill="#34D399" stroke="#059669" stroke-width="2"/>
  </g>

  <!-- Labels -->
  <text x="400" y="440" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">MORINGA POWDER</text>
  <text x="400" y="475" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">ORGANIC • FINE MESH • EXPORT</text>
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">BRAHMA CHAITANYA GLOBAL • IMPORT | EXPORT</text>
</svg>
