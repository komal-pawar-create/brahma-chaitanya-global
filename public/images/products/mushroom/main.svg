<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="50%" stop-color="#0D253F"/>
      <stop offset="100%" stop-color="#0A3E4C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D17A"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="270" r="160" fill="#0A9396" opacity="0.1"/>
  <circle cx="400" cy="270" r="120" fill="none" stroke="#C59B27" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Stylized Mushroom Icon -->
  <g transform="translate(400, 270) scale(1.3)">
    <!-- Stem -->
    <path d="M-18,0 L-12,50 C-12,58 12,58 12,50 L18,0 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>
    <!-- Cap -->
    <path d="M-55,0 C-55,-45 55,-45 55,0 C55,8 -55,8 -55,0 Z" fill="#D97706" stroke="#92400E" stroke-width="3"/>
    <!-- Spots -->
    <circle cx="-25" cy="-15" r="7" fill="#FEF3C7" opacity="0.8"/>
    <circle cx="10" cy="-25" r="8" fill="#FEF3C7" opacity="0.8"/>
    <circle cx="30" cy="-10" r="6" fill="#FEF3C7" opacity="0.8"/>
  </g>

  <!-- Labels -->
  <text x="400" y="440" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">MUSHROOM POWDER</text>
  <text x="400" y="475" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">DEHYDRATED • PREMIUM GRADE</text>
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">BRAHMA CHAITANYA GLOBAL • IMPORT | EXPORT</text>
</svg>
