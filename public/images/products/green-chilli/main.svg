<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="50%" stop-color="#0D253F"/>
      <stop offset="100%" stop-color="#0A3E4C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D17A"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EABB0"/>
      <stop offset="100%" stop-color="#0A9396"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="270" r="160" fill="#0A9396" opacity="0.1"/>
  <circle cx="400" cy="270" r="120" fill="none" stroke="#C59B27" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>
  
  <!-- Stylized Chilli Icon -->
  <g transform="translate(400, 260) scale(1.4)">
    <path d="M-15,-70 C-5,-75 15,-75 25,-60 C35,-45 40,-20 35,15 C30,45 10,75 -15,95 C-20,99 -25,95 -23,90 C-15,65 -5,40 -2,10 C1,-20 -5,-45 -15,-65 Z" fill="#10B981" stroke="#047857" stroke-width="3"/>
    <!-- Stem -->
    <path d="M2,-68 C5,-85 20,-95 30,-98" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
    <!-- Highlight -->
    <path d="M5,-50 C15,-30 18,0 12,35" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Product Labels -->
  <text x="400" y="440" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">GREEN CHILLI</text>
  <text x="400" y="475" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">G4 • G5 • HYBRID • EXPORT GRADE</text>
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">BRAHMA CHAITANYA GLOBAL • IMPORT | EXPORT</text>
