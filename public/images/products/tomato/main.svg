<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="50%" stop-color="#0D253F"/>
      <stop offset="100%" stop-color="#0A3E4C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D17A"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="270" r="160" fill="#0A9396" opacity="0.1"/>
  <circle cx="400" cy="270" r="120" fill="none" stroke="#C59B27" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Stylized Tomato Icon -->
  <g transform="translate(400, 270) scale(1.3)">
    <circle cx="0" cy="5" r="55" fill="#EF4444" stroke="#B91C1C" stroke-width="3"/>
    <!-- Highlight -->
    <path d="M-25,-25 C-10,-40 10,-40 25,-25" stroke="#FCA5A5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Stem/Leaves -->
    <path d="M0,-48 L0,-65" stroke="#15803D" stroke-width="5" stroke-linecap="round"/>
    <path d="M0,-48 L-18,-45 M0,-48 L18,-45 M0,-48 L-10,-35 M0,-48 L10,-35" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Labels -->
  <text x="400" y="440" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">EXPORT TOMATO</text>
  <text x="400" y="475" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">FRESH HARVEST • CONTROLLED PACKING</text>
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">BRAHMA CHAITANYA GLOBAL • IMPORT | EXPORT</text>
</svg>
